name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release -p tasklist-api

  integration:
    name: integration (cosmos emulator)
    runs-on: ubuntu-latest
    services:
      # Azure Cosmos DB Linux emulator (vNext, API for NoSQL). It serves HTTP by default,
      # so PROTOCOL=https opts into TLS (service containers can only pass env, not args).
      # GitHub waits for the health check — which curls the emulator's own readiness probe
      # inside the container — to pass before running the job's steps.
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        ports:
          - 8081:8081
        env:
          PROTOCOL: https
        options: >-
          --health-cmd "curl -sf http://localhost:8080/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm emulator gateway is reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sk https://localhost:8081/ -o /dev/null 2>/dev/null; then
              echo "gateway reachable"; exit 0
            fi
            echo "waiting for gateway ($i/30)"; sleep 5
          done
          echo "gateway did not become reachable" >&2; exit 1
      - name: ETag round-trip integration test
        env:
          TASKLIST_COSMOS_EMULATOR: "1"
          COSMOS__ENDPOINT: https://localhost:8081
        run: cargo test -p tasklist-infrastructure --test cosmos_etag -- --nocapture

  web:
    name: web (spa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build

  drift:
    name: openapi client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Regenerate OpenAPI document
        run: cargo run -p tasklist-api -- openapi > web/openapi.json
      - name: Regenerate typed client
        run: npm run gen:api
        working-directory: web
      - name: Fail on drift
        run: git diff --exit-code web/openapi.json web/src/ApiClient.generated.ts

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t tasklist:ci .
